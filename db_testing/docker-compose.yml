services:
  db:
    image: postgres:15
    container_name: local-pg
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: testing_password
      POSTGRES_DB: testing_db
    ports:
      - "5432:5432"
    volumes:
      # This line saves your data locally so it survives container restarts
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: